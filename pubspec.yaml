name: loan_app_new
description: A comprehensive loan management mobile application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Supabase
  supabase_flutter: ^2.5.0
  
  # Networking
  http: ^1.1.0
  
  # State Management
  provider: ^6.0.5
  
  # Local Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  
  # UI Components
  intl: ^0.18.1
  shimmer: ^3.0.0
  fluttertoast: ^8.2.2
  connectivity_plus: ^7.3.1
  
  # Image Picker
  image_picker: ^1.0.4
  
  # Date & Time
  table_calendar: ^3.0.9
  
  # Charts
  fl_chart: ^0.68.0
  
  # Permission handling
  permission_handler: ^11.0.1
  
  # URL Launcher
  url_launcher: ^6.2.1
  
  # Loading animations
  flutter_spinkit: ^5.2.0
  
  # ✅ Added objective_c for native assets support
  objective_c: ^9.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  
  # Assets
  assets:
    - assets/images/
    - assets/icons/
  
  # Disable Swift Package Manager auto-migration (uses CocoaPods instead)
  config:
    enable-swift-package-manager: false

# Flutter Launcher Icons Configuration
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/loanIcon.jpg"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/loanIcon.jpg"